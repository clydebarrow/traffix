name: Build and Publish to Beta

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false
          
      - name: Decode and setup keystore
        env:
          ENCODED_KEYSTORE: ${{ secrets.PLAY_STORE_UPLOAD_KEY }}
        run: |
          echo "$ENCODED_KEYSTORE" | base64 -d > ${{ github.workspace }}/release-keystore.jks
          
      - name: Setup publisher credentials
        env:
          PLAY_STORE_CONFIG: ${{ secrets.PLAY_STORE_CONFIG_JSON }}
        run: |
          mkdir -p ${{ github.workspace }}/secrets
          echo "$PLAY_STORE_CONFIG" > ${{ github.workspace }}/secrets/publisher-credentials.json
          
      - name: Create gradle.properties with secrets
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PLAY_MANAGED_KEY_ALIAS }}
          MAPBOX_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}
        run: |
          cat >> gradle.properties << EOF
          RELEASE_STORE_PASSWORD=$RELEASE_STORE_PASSWORD
          RELEASE_KEY_PASSWORD=$RELEASE_KEY_PASSWORD
          PLAY_MANAGED_KEY_ALIAS=$KEY_ALIAS
          PLAY_MANAGED_STORE_FILE=${{ github.workspace }}/release-keystore.jks
          MAPBOX_DOWNLOADS_TOKEN=$MAPBOX_TOKEN
          EOF
          
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        
      - name: Build release bundle
        run: ./gradlew androidApp:bundleRelease
        
      - name: Publish to Google Play Beta
        run: ./gradlew androidApp:publishReleaseBundle
        
      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-outputs
          path: |
            androidApp/build/outputs/bundle/release/*.aab
            androidApp/build/outputs/apk/release/*.apk
          retention-days: 30
          
      - name: Commit version bump
        if: success()
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add version.properties
          git diff --staged --quiet || git commit -m "Bump build number after beta publish [skip ci]"
          git push
